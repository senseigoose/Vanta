[workspace]
resolver = "2"
members = ["crates/engine", "crates/uci", "crates/datagen"]
# crates/wasm is built separately for wasm32 (scripts/build-wasm.sh); it is excluded so
# plain native builds and tests never touch it.
exclude = ["crates/wasm"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
