[workspace]
resolver = "2"
members = ["crates/engine", "crates/uci", "crates/datagen"]
# crates/wasm is added once it exists; it builds for wasm32 so keep it out of
# default native builds (or add it and use `cargo build -p engine -p uci`).

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
